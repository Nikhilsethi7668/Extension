services:
  api:
    build: ./api
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DATABASE=${MONGO_DATABASE}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FAL_KEY=${FAL_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FLASH_FENDER_IMG_KEY=${FLASH_FENDER_IMG_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - UPLOAD_STORAGE_PATH=${UPLOAD_STORAGE_PATH:-./uploads}
      - UPLOAD_PUBLIC_URL=${UPLOAD_PUBLIC_URL}
    volumes:
      - ./api:/app
      - /app/node_modules
      - /root/projects/flashfander/flashfander/api/uploads:/app/uploads
    networks:
      - extension-network
    env_file:
      - .env
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "3682:3682"
    environment:
      - BACKEND_URL=${BACKEND_URL}
      - VITE_API_BASE_URL=${BACKEND_URL:-http://localhost:5573}
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - extension-network
    env_file:
      - .env
    restart: unless-stopped

networks:
  extension-network:
    driver: bridge

